[project]
name = "qwen3-asr-tensorrt"
version = "0.1.0"
description = "Windows-first Qwen3-ASR inference with TensorRT and ExLlamaV3"
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate>=1.12.0",
    "librosa>=0.11.0",
    "soundfile>=0.13.0",
    "transformers>=5.13.0,<6",
    "torch==2.10.0",
]

[project.scripts]
qwen3-asr = "qwen3_asr_trt.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
