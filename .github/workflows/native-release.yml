name: native engine builder

on:
  push:
    tags: ["native-v*"]

permissions:
  contents: write

jobs:
  build:
    # windows-latest ships Visual Studio 2026, which CUDA 12.8 cannot parse;
    # the 2022 image has the VS 2022 toolset nvcc supports.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # TensorRT runtime plus the two CUDA wheels: cudart supplies the DLL and then
      # the CUDA toolkit below supplies headers and nvcc for the runtime kernels.
      - name: Install TensorRT runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check `
            "tensorrt-cu12==11.4.0.106" "nvidia-cuda-runtime-cu12>=12.8" "soundfile"

      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.0"
          method: network

      # The runner's Visual Studio is newer than this CMake knows about, so use
      # vswhere to import the MSVC environment and build with Ninja.
      - name: Set up MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "no Visual Studio C++ toolset found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Fetch TensorRT headers and import libraries
        shell: pwsh
        run: |
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          ./native/scripts/fetch_deps.ps1 -PythonSite $site

      # The runtime reads mel filters and the tokenizer from native/assets, which
      # only need the small config files of the checkpoint. Transformers requires
      # a torch installation for the feature extractor, so use the CPU build.
      - name: Generate native assets
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "huggingface_hub" "transformers>=5.13,<6" torch
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen3-ASR-0.6B-hf', allow_patterns=['*.json', '*.txt', '*.jinja'], local_dir='.ci/qwen3-asr-0.6b-hf')"
          python native/tools/gen_assets.py --model .ci/qwen3-asr-0.6b-hf --out native/assets

      - name: Configure
        shell: pwsh
        run: |
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          cmake -S native -B native/build -G Ninja "-DPYTHON_SITE=$site"

      - name: Build
        shell: pwsh
        run: cmake --build native/build

      # There is no GPU on the runner, so this checks that both binaries start with
      # every TensorRT, CUDA and libsndfile DLL resolved. Building an engine and
      # transcribing need a device and are verified by hand on the target machine.
      - name: Smoke test
        shell: pwsh
        run: |
          ./native/build/build-engine.exe --version
          ./native/build/build-engine.exe --help | Out-Null
          $usage = & ./native/build/qwen3-asr-native.exe 2>&1
          if (-not ($usage -match 'usage:')) { throw "runtime did not start" }

      - name: Package
        shell: pwsh
        run: |
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          # TensorRT loads one builder resource per compute capability, so each
          # GPU family gets its own self-contained zip.
          foreach ($arch in @("sm75", "sm80", "sm86", "sm89", "sm90", "sm100", "sm120")) {
            ./native/scripts/pack_release.ps1 -Site $site -Version "${{ github.ref_name }}" -Arch $arch
          }

      - uses: actions/upload-artifact@v4
        with:
          name: build-engine
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/*.zip dist/*.sha256 --clobber
          } else {
            gh release create $tag dist/*.zip dist/*.sha256 `
              --title $tag `
              --notes "Prebuilt native runtime for TensorRT 11.4: qwen3-asr-native.exe transcribes and qwen3-asr-build-engine builds .engine files from the published ONNX graphs, without Python. The runtime is a fat binary for sm75 to sm120; pick the build-engine zip for your GPU compute capability (TensorRT builder resources are per architecture) - sm75 Turing (T4, RTX 20), sm80 A100, sm86 RTX 30, sm89 RTX 40, sm90 H100, sm100 Blackwell, sm120 RTX 50. Check it with 'nvidia-smi --query-gpu=compute_cap --format=csv,noheader'. Forced alignment additionally needs qwen3-asr-aligner-assets.zip."
          }
