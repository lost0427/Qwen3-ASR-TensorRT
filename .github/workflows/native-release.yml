name: native engine builder

on:
  push:
    tags: ["native-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the TensorRT runtime and cudart are needed: build-engine has no CUDA
      # kernels of its own, so the runner does not install the CUDA toolkit.
      - name: Install TensorRT runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check `
            "tensorrt-cu12==11.4.0.106" "nvidia-cuda-runtime-cu12>=12.8"

      # The runner's Visual Studio is newer than this CMake knows about, so use
      # vswhere to import the MSVC environment and build with Ninja.
      - name: Set up MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "no Visual Studio C++ toolset found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Fetch TensorRT headers and import libraries
        shell: pwsh
        run: |
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          ./native/scripts/fetch_deps.ps1 -PythonSite $site

      - name: Configure
        shell: pwsh
        run: |
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          cmake -S native -B native/build -G Ninja `
            -DQASR_BUILD_RUNTIME=OFF "-DPYTHON_SITE=$site"

      - name: Build
        shell: pwsh
        run: cmake --build native/build

      # There is no GPU on the runner, so this checks that the binary starts with
      # every TensorRT and CUDA DLL resolved. Building an engine needs a device
      # and is verified by hand on the target machine.
      - name: Smoke test
        shell: pwsh
        run: |
          ./native/build/build-engine.exe --version
          ./native/build/build-engine.exe --help | Out-Null

      - name: Package
        shell: pwsh
        run: |
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          # TensorRT loads one builder resource per compute capability, so each
          # GPU family gets its own self-contained zip.
          foreach ($arch in @("sm75", "sm80", "sm86", "sm89", "sm90", "sm100", "sm120")) {
            ./native/scripts/pack_release.ps1 -Site $site -Version "${{ github.ref_name }}" -Arch $arch
          }

      - uses: actions/upload-artifact@v4
        with:
          name: build-engine
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/*.zip dist/*.sha256 --clobber
          } else {
            gh release create $tag dist/*.zip dist/*.sha256 `
              --title $tag `
              --notes "Prebuilt build-engine.exe for TensorRT 11.4: builds .engine files from the published ONNX graphs without Python. Pick the zip for your GPU compute capability - sm75 Turing (T4, RTX 20), sm80 A100, sm86 RTX 30, sm89 RTX 40, sm90 H100, sm100 Blackwell, sm120 RTX 50. Check it with 'nvidia-smi --query-gpu=compute_cap --format=csv,noheader'."
          }
